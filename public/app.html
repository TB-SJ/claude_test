<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Calendar Optimizer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1><span id="brandIcon">🗓</span> <span id="brandName">Calendar Optimizer</span></h1>
        <div class="sub" id="tzLabel"></div>
      </div>
      <div class="row" style="gap:6px">
        <button class="ghost" id="themeBtn" title="Toggle pirate theme" aria-label="Toggle theme">👒</button>
        <button class="ghost" id="logoutBtn" title="Sign out">Sign out</button>
      </div>
    </header>

    <!-- Not connected -->
    <section class="card hidden" id="connectCard">
      <h2>Connect your calendar</h2>
      <p class="muted">Link a calendar to get started.</p>
      <div id="connectButtons"></div>
    </section>

    <!-- Daily brief (how's my day) -->
    <section class="card hidden" id="briefCard">
      <div class="row">
        <button class="collapse-btn" id="briefCollapse" aria-label="Collapse brief">▾</button>
        <h2 style="margin:0" id="briefTitle">🌅 Today</h2>
        <span class="spacer"></span>
        <button class="ghost hidden" id="notifyBtn" title="Enable reminders">🔔 Reminders</button>
        <button class="ghost" id="briefRefresh" title="Refresh">↻</button>
      </div>
      <div class="card-body" id="briefBody"></div>
    </section>

    <!-- Connected: today -->
    <section class="card hidden" id="todayCard">
      <div class="row">
        <button class="collapse-btn" id="todayCollapse" aria-label="Collapse schedule">▾</button>
        <h2 style="margin:0">Your schedule</h2>
        <span class="spacer"></span>
        <button class="ghost" id="addEventToggle">＋ Add</button>
        <div class="toggle" id="scopeToggle">
          <button data-scope="day" class="active">Day</button>
          <button data-scope="week">Week</button>
        </div>
      </div>

      <div class="card-body" id="todayBody">
        <!-- Quick-add event: typed fields → saved directly (no AI, no cost) -->
        <div id="eventForm" class="hidden" style="margin-top:10px">
          <input id="evTitle" placeholder="Event title" style="width:100%" />
          <div class="row" style="margin-top:8px">
            <input id="evDate" type="date" style="flex:1" title="date" />
            <input id="evTime" type="time" style="flex:1" title="start time" />
            <input id="evMins" type="number" min="5" step="5" value="60" style="width:84px" title="minutes" />
          </div>
          <input id="evDesc" placeholder="Notes (optional)" style="width:100%; margin-top:8px" />
          <button class="primary full" id="evAddBtn" style="margin-top:8px">Add event</button>
        </div>

        <div id="eventList" style="margin-top:10px"></div>
        <div class="row" style="margin-top:14px">
          <button class="ghost" id="refreshBtn">↻ Refresh</button>
          <span class="spacer"></span>
          <label class="ai-toggle hidden" id="claudeToggleWrap" title="Let Claude propose the rearrangement (small API cost). Off = free rules engine.">
            <input type="checkbox" id="claudeToggle" /> 🧠 Claude
          </label>
          <button class="primary" id="optimizeBtn">✨ Optimize my <span id="optScope">day</span></button>
        </div>
      </div>
    </section>

    <!-- Tasks (flexible to-dos, app-only) -->
    <section class="card hidden" id="tasksCard">
      <div class="row">
        <button class="collapse-btn" id="tasksCollapse" aria-label="Collapse tasks">▾</button>
        <h2 style="margin:0">✅ Tasks</h2>
        <span class="spacer"></span>
        <button class="ghost" id="addTaskToggle">＋ Add</button>
      </div>
      <div class="card-body" id="tasksBody">
        <div id="taskForm" class="hidden" style="margin-top:10px">
          <input id="taskTitle" placeholder="What do you need to do?" style="width:100%" />
          <div class="row" style="margin-top:8px">
            <input id="taskMins" type="number" min="5" step="5" value="30" style="width:84px" title="minutes" />
            <select id="taskPriority" style="flex:1">
              <option value="high">High</option>
              <option value="med" selected>Medium</option>
              <option value="low">Low</option>
            </select>
            <input id="taskDeadline" type="date" style="flex:1" title="deadline (optional)" />
          </div>
          <button class="primary full" id="taskAddBtn" style="margin-top:8px">Add task</button>
        </div>
        <div id="taskList" style="margin-top:10px"></div>
        <button class="primary full" id="planBtn" style="margin-top:12px">🗓 Plan my day</button>
      </div>
    </section>

    <!-- Suggested task plan (read-only; not written to the calendar) -->
    <section class="card hidden" id="taskPlanCard">
      <div class="row">
        <h2 style="margin:0">🗓 Suggested plan</h2>
        <span class="spacer"></span>
        <button class="ghost" id="planCloseBtn">Close</button>
      </div>
      <p class="muted" style="margin:6px 0">Tasks (📋) fit around today's events — a suggestion, not saved to your calendar.</p>
      <div id="planBody" style="margin-top:6px"></div>
      <button class="primary full hidden" id="commitPlanBtn" style="margin-top:12px">＋ Add these blocks to my calendar</button>
    </section>

    <!-- Read-only query result (show schedule / show free time) -->
    <section class="card hidden" id="queryCard">
      <div class="row">
        <h2 style="margin:0" id="queryTitle">Schedule</h2>
        <span class="spacer"></span>
        <button class="ghost" id="queryCloseBtn">Close</button>
      </div>
      <p class="muted" id="queryHeard" style="margin:8px 0 0"></p>
      <div id="queryBody" style="margin-top:10px"></div>
    </section>

    <!-- Voice command confirmation (add / remove / move / edit) -->
    <section class="card hidden" id="voiceCard">
      <div class="row">
        <h2 style="margin:0">🎤 Voice command</h2>
        <span class="spacer"></span>
      </div>
      <p class="muted" id="voiceHeard" style="margin:8px 0 0"></p>
      <p id="voiceSummary" style="margin:10px 0; font-weight:600"></p>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="voiceCancelBtn">Cancel</button>
        <span class="spacer"></span>
        <button class="primary" id="voiceConfirmBtn">Confirm</button>
      </div>
    </section>

    <!-- Optimization proposal -->
    <section class="card hidden" id="proposalCard">
      <div class="row">
        <h2 style="margin:0">Proposed changes</h2>
        <span class="spacer"></span>
        <span class="pill" id="analysisPill"></span>
      </div>

      <div id="beforeAfter" style="margin-top:12px"></div>

      <div id="reasons" style="margin-top:14px"></div>

      <div class="row" style="margin-top:16px">
        <button class="ghost" id="cancelBtn">Cancel</button>
        <span class="spacer"></span>
        <button class="primary" id="applyBtn">Apply changes</button>
      </div>
    </section>

    <div class="center muted hidden" id="loading"><span class="spinner"></span></div>
  </div>

  <!-- Floating mic button (voice control) -->
  <button id="micBtn" class="fab hidden" title="Speak a command" aria-label="Speak a command">🎤</button>
  <div id="micStatus" class="mic-status hidden">Listening… speak now</div>

  <script src="/app.js"></script>
</body>
</html>
